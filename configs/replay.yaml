# Offline replay configuration used by scripts/backtest.py.
# Run with: python scripts/backtest.py --config configs/replay.yaml --start 2024-01-01

exchange:
  name: binance
  symbol: BTCUSDT
  tick_size: 0.001
  depth_levels: 20
  price_precision: 2

pipeline:
  mode: replay
  timeframe: 1m
  buffer_size: 10000
  history_bars: 20
  record_path: null
  replay_path: data/btcusdt-ticks.jsonl

primitives:
  delta_ratio_threshold: 0.15
  imbalance_ratio_threshold: 1.5
  absorption_min_confidence: 60

patterns:
  min_confidence: 50
  max_patterns: 5
  max_age_bars: 3

ai:
  provider: openai
  model: gpt-4o
  temperature: 0.2
  max_tokens: 300
  min_reward_risk: 1.5

optimization:
  tier: auto
  compact_json: true
  short_keys: true
  drop_nulls: true
  round_numbers: true
  delta_encode: true
  cache_static: true
  max_patterns: 3
  max_levels: 3