[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orderflow-ai"
version = "0.1.0"
description = "AI-powered order flow analysis engine that turns raw market microstructure data into AI-ready signals."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OrderFlow Engineer Contributors" }]
keywords = ["order-flow", "market-microstructure", "trading", "llm", "ai", "binance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
live = [
    "httpx>=0.27",
    "websockets>=12.0",
]
ai = [
    "httpx>=0.27",
]
cache = [
    "redis>=5.0",
]
storage = [
    "SQLAlchemy>=2.0",
    "asyncpg>=0.29",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Sultanrayan/orderflow-tooling"
Repository = "https://github.com/Sultanrayan/orderflow-tooling"
Documentation = "https://github.com/Sultanrayan/orderflow-tooling/blob/main/Docs/OrderflowEngineer.md"

[project.scripts]
orderflow = "orderflow_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orderflow_ai = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RET", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]